<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reasons I Love You ❤️</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/reasons.css">

    <script src="../js/reasons.js" defer></script>
</head>

<body>

    <main class="reasons-page">

        <section class="reasons-header">

            <h1>Reasons I Love You</h1>

            <p id="instruction">
                There are probably more than I can count...
            </p>

        </section>


        <section class="letter-scene">

            <div class="envelope" id="envelope">

                <div class="envelope-back"></div>

                <div class="letter">
                    <p id="reason"></p>
                </div>

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

            </div>

        </section>


        <p id="tap-message">
            Open it ❤️
        </p>


        <button id="continue-btn">
            Continue ❤️
        </button>

    </main>

</body>

</html>
